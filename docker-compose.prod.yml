# Compose de producciÃ³n â€” VPS Iglesia (179.236.255.48)
# Red n8n-internal ya existe en el VPS (creada por el stack de n8n + Traefik)
# Traefik usa dynamic.yml (no labels) â†’ /opt/n8n/traefik/dynamic.yml
# Imagen pÃºblica en DockerHub: soporteyapame/ipec-v3:latest
networks:
  n8n-internal:
    external: true
  ipec-v3-net:
    name: ipec-v3-net
    internal: true

services:
  db:
    image: postgres:16-alpine
    container_name: ipec-v3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ipec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ipec
    volumes:
      - ipec_v3_pgdata:/var/lib/postgresql/data
    networks:
      - ipec-v3-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipec -d ipec"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: git.sistemasass.online/jscothserver/ipec-v3:latest
    container_name: ipec-v3-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ipec:${POSTGRES_PASSWORD}@db:5432/ipec?schema=public
      NODE_ENV: production
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?Falta SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?Falta SUPERADMIN_PASSWORD}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Admin}
      SESSION_SECRET: ${SESSION_SECRET:?Falta SESSION_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://v3.suplenitud.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      PRAYER_NOTIFICATION_WEBHOOK_URL: ${PRAYER_NOTIFICATION_WEBHOOK_URL:-}
      PRAYER_NOTIFICATION_WEBHOOK_SECRET: ${PRAYER_NOTIFICATION_WEBHOOK_SECRET:-}
    networks:
      - ipec-v3-net
      - n8n-internal
volumes:
  ipec_v3_pgdata:
    name: ipec_v3_pgdata

